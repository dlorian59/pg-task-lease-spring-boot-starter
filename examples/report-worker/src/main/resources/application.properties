spring.main.web-application-type=none
spring.r2dbc.url=${TASKS_R2DBC_URL}
spring.r2dbc.username=${TASKS_DB_USER}
spring.r2dbc.password=${TASKS_DB_PASSWORD}
spring.r2dbc.pool.max-size=8
spring.r2dbc.pool.initial-size=0
# Apply the library SQL migration explicitly before starting this application.
# Примените SQL-миграцию библиотеки явно до запуска этого приложения.
spring.sql.init.mode=never
pg-task-lease.worker.enabled=true
pg-task-lease.worker.concurrency=2
pg-task-lease.worker.poll-interval=100ms
pg-task-lease.worker.handler-timeout=1m
reports.directory=${REPORTS_DIRECTORY:reports}
